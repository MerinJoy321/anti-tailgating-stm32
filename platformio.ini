; Alternative to the Makefile. NOT tested by the author (PlatformIO packages could not be downloaded
; in the build sandbox); the same sources were compiled with arm-none-eabi-gcc via the Makefile.
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = serial        ; ROM UART bootloader on USART1 (PA9/PA10), BOOT0 jumper = 1 while flashing
upload_port = COM5
board_build.ldscript = STM32F103_32K_10K.ld   ; 32 KB / 10 KB map: safe on C6 and C8 parts (the board default assumes 20 KB RAM)
build_flags = -Iinclude -Os -Wall
build_src_filter = +<*> +<../secure/*.c>
; add -DTG_ATTACK_DEMO to build_flags for the attack experiments
